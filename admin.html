<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BottleSense 後台</title>
<style>
:root{--bg:#0b0b0c;--card:#16161a;--line:#2a2a30;--gold:#d4af37;--txt:#ece8dc;--dim:#8d8a80;--red:#e06c6c;--grn:#6cc08b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,"Noto Sans TC",sans-serif;padding:16px;max-width:1100px;margin:0 auto}
h1{font-size:18px;color:var(--gold);margin:6px 0 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2{font-size:14px;color:var(--gold);margin:0 0 10px;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:24px;color:var(--gold)}.kpi span{color:var(--dim);font-size:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
input,button,select{font:inherit;background:#0f0f12;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
button{cursor:pointer;border-color:var(--gold);color:var(--gold)}button.dng{border-color:var(--red);color:var(--red)}button.sm{padding:4px 10px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}.bar i{display:block;height:8px;background:var(--gold);border-radius:4px;min-width:2px}.bar em{font-style:normal;color:var(--dim);margin-left:auto}
.it{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;justify-content:space-between;align-items:center}.it:first-of-type{border-top:0}
.tag{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--dim)}
.dim{color:var(--dim)}#login{max-width:340px;margin:18vh auto}
svg{width:100%;height:auto;max-height:200px;display:block}
</style></head><body>
<div id="login" class="card"><h2>BottleSense 後台登入</h2>
<div class="row"><input id="tok" type="password" placeholder="ADMIN_TOKEN" style="flex:1"><button onclick="go()">登入</button></div>
<p class="dim" id="lerr"></p></div>
<div id="app" hidden>
<h1><span>BottleSense 後台</span><span class="row"><select id="days" onchange="load()"><option value="7">7 日</option><option value="14">14 日</option><option value="30" selected>30 日</option></select><button class="sm" onclick="load()">重新整理</button><button class="sm dng" onclick="out()">登出</button></span></h1>
<div id="aierr"></div>
<div class="grid" id="kpi"></div>
<div class="card"><h2>每日掃描 (訪客 / 會員)</h2><div id="ch1"></div><div class="dim" style="font-size:12px">紅線：額度用盡次數</div></div>
<div class="card"><h2>每日活躍 / 新註冊</h2><div id="ch2"></div></div>
<div class="two">
<div class="card"><h2>熱門類別</h2><div id="cat"></div></div>
<div class="card"><h2>熱門產地國家</h2><div id="cty"></div></div>
</div>
<div class="card"><h2>AI 成本估算</h2><div class="row">每次掃描單價 US$ <input id="unit" type="number" step="0.001" value="0.012" style="width:90px" oninput="cost()"><span id="costv"></span></div><div class="dim" style="font-size:12px;margin-top:6px" id="mdl"></div></div>
<div class="card"><h2>內容審核 <span class="tag" id="modn"></span></h2><div id="mod"></div></div>
<div class="card"><h2>封鎖用戶</h2><div class="row"><input id="bem" placeholder="email" style="flex:1;min-width:200px"><input id="brs" placeholder="原因 (選填)"><button class="dng" onclick="ban(0)">封鎖</button><button onclick="ban(1)">解封</button></div><p class="dim" id="bmsg"></p></div>
<div class="card"><h2>商家與特價產品</h2>
<div class="row" style="margin-bottom:8px"><select id="msel" onchange="mfill()" style="min-width:160px"></select><input id="mid" placeholder="商家代號 a-z0-9_-" style="width:150px"><input id="mnm" placeholder="商家名稱"><input id="murl" placeholder="https://官網" style="flex:1;min-width:180px"></div>
<textarea id="mcsv" rows="8" style="width:100%;background:#0f0f12;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.5 monospace" placeholder="每行一款，用 Tab 或逗號分隔：&#10;酒名, 產品連結, 現價, 原價(特價才填), 特價到期 YYYY-MM-DD, 類別, 國家, 產區"></textarea>
<div class="row" style="margin-top:8px"><button onclick="msave()">儲存商家</button><button class="dng" onclick="mdel()">刪除商家</button><span class="dim" id="mmsg"></span></div>
<div class="dim" style="font-size:12px;margin-top:6px">填了「原價」就會顯示特價標籤；到期日過後自動回復一般價。</div></div>
<div class="two">
<div class="card"><h2>商家曝光 / 點擊 (本月)</h2><div id="mer"></div></div>
<div class="card"><h2>用戶需求 (本月)</h2><div id="dem"></div></div>
</div></div>
<script>
const API="https://bottlesense-api.fiveathree.workers.dev";let T=sessionStorage.getItem('bs_adm')||'',D=null;
const $=id=>document.getElementById(id),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,o){const r=await fetch(API+p,Object.assign({headers:{Authorization:'Bearer '+T,'Content-Type':'application/json'}},o||{}));if(!r.ok)throw new Error(r.status);return r.json()}
async function go(){T=$('tok').value.trim();try{await load();sessionStorage.setItem('bs_adm',T)}catch(e){$('lerr').textContent='登入失敗 ('+e.message+')'}}
function out(){sessionStorage.removeItem('bs_adm');location.reload()}
const sum=(a,k)=>a.reduce((s,x)=>s+(x[k]||0),0);
function bars(el,obj,n){const a=Object.entries(obj).sort((x,y)=>y[1]-x[1]).slice(0,n||8),m=a.length?a[0][1]:1;$(el).innerHTML=a.length?a.map(([k,v])=>`<div class="bar"><span style="min-width:64px">${E(k)}</span><i style="width:${Math.max(2,v/m*50)}%"></i><em>${v}</em></div>`).join(''):'<span class="dim">暫無數據</span>'}
function chart(el,s,stack,lines){const W=640,H=180,P=24,n=s.length,bw=(W-P*2)/n;let mx=1;s.forEach(x=>{mx=Math.max(mx,stack.reduce((t,k)=>t+(x[k]||0),0),...lines.map(l=>x[l[0]]||0))});
let g=`<svg viewBox="0 0 ${W} ${H+16}"><line x1="${P}" x2="${W-P}" y1="${H}" y2="${H}" stroke="#2a2a30"/><text x="2" y="12" fill="#8d8a80" font-size="10">${mx}</text>`;
s.forEach((x,i)=>{let y=H;stack.forEach((k,j)=>{const h=(x[k]||0)/mx*(H-16);y-=h;g+=`<rect x="${P+i*bw+1}" y="${y}" width="${Math.max(1,bw-2)}" height="${h}" fill="${j?'#d4af37':'#7a6a2c'}"/>`});if(i%Math.ceil(n/8)==0)g+=`<text x="${P+i*bw}" y="${H+12}" fill="#8d8a80" font-size="9">${x.d.slice(5)}</text>`});
lines.forEach(l=>{g+=`<polyline fill="none" stroke="${l[1]}" stroke-width="2" points="${s.map((x,i)=>`${P+i*bw+bw/2},${H-(x[l[0]]||0)/mx*(H-16)}`).join(' ')}"/>`});
$(el).innerHTML=g+'</svg>'}
function cost(){if(!D)return;const n=sum(D.series,'scan');$('costv').textContent=` × ${n} 次 ≈ US$ ${(n*parseFloat($('unit').value||0)).toFixed(2)}`}
async function load(){const d=$('days').value;const [o,st,fl]=await Promise.all([api('/api/admin/overview?days='+d),api('/api/admin/stats').catch(()=>({})),api('/api/admin/explore/flagged').catch(()=>[])]);D=o;const s=o.series,t=o.totals;
$('aierr').innerHTML=o.ailast?`<div class="card" style="border-color:var(--red)"><h2 style="color:var(--red)">AI 最近一次錯誤</h2><div>HTTP ${E(o.ailast.status)} ・ 模型 ${E(o.ailast.model)} ・ ${new Date(o.ailast.t).toLocaleString()}</div><div class="dim" style="word-break:break-all;margin-top:4px">${E(o.ailast.msg)}</div></div>`:'';$('login').hidden=true;$('app').hidden=false;
$('kpi').innerHTML=[['註冊用戶',t.users],['期內掃描',sum(s,'scan')],['期內活躍(獨立)',sum(s,'active')],['期內新註冊',sum(s,'signup')],['額度用盡',sum(s,'quota_out')],['非酒類被拒',sum(s,'not_alcohol')],['AI 錯誤次數',sum(s,'ai_err')],['探索已公開',t.exp_live],['待審/被舉報',t.exp_pending+'/'+t.exp_hidden],['已封鎖',t.banned],['商家',t.merchants]].map(([a,b])=>`<div class="kpi"><b>${b}</b><span>${a}</span></div>`).join('');
chart('ch1',s,['scan_user','scan_guest'],[['quota_out','#e06c6c']]);chart('ch2',s,[],[['active','#d4af37'],['signup','#6cc08b']]);
const agg=p=>{const r={};s.forEach(x=>{for(const k in x)if(k.startsWith(p))r[k.slice(p.length)]=(r[k.slice(p.length)]||0)+x[k]});return r};
bars('cat',agg('c:'));bars('cty',agg('k:'),10);const m=agg('mdl:');$('mdl').textContent='模型分佈：'+(Object.entries(m).map(([k,v])=>k+' '+v).join('、')||'暫無');cost();
$('modn').textContent=fl.length+' 項';$('mod').innerHTML=fl.length?fl.map(i=>`<div class="it"><div><span class="tag">${i._flag==='pending'?'待審':'被舉報 '+i._reports}</span> <b>${E(i.name||i.title||i.id)}</b><div class="dim">${E([i.country,i.region,i.place||i.city].filter(Boolean).join(' · '))}</div></div><div class="row"><button class="sm" onclick="mod('approve','${E(i.id)}')">通過</button><button class="sm dng" onclick="mod('remove','${E(i.id)}')">移除</button></div></div>`).join(''):'<span class="dim">沒有待處理項目</span>';
const me=st.merchants||{};$('mer').innerHTML=Object.keys(me).length?Object.entries(me).map(([k,v])=>`<div class="bar"><span>${E(k)}</span><em>${Object.entries(v).map(([a,b])=>E(a)+' '+b).join(' / ')}</em></div>`).join(''):'<span class="dim">暫無數據</span>';
mload();$('dem').innerHTML=(st.demand||[]).slice(0,10).map(x=>`<div class="bar"><span>${E(x.name||x.k||x.type)} <span class="tag">${({wishlist:'想買',scan:'掃描',share_wishlist:'分享想買'})[x.type]||E(x.type)}</span></span><em>${x.c}</em></div>`).join('')||'<span class="dim">暫無數據</span>'}

let MER=[];
async function mload(){MER=await api('/api/admin/merchants').catch(()=>[]);$('msel').innerHTML='<option value="">+ 新商家</option>'+MER.map(m=>`<option value="${E(m.id)}">${E(m.name)} (${m.products.length})</option>`).join('')}
function mfill(){const m=MER.find(x=>x.id===$('msel').value);$('mid').value=m?m.id:'';$('mid').disabled=!!m;$('mnm').value=m?m.name:'';$('murl').value=m?m.url:'';$('mcsv').value=m?m.products.map(p=>[p.n,p.u,p.p,p.was||'',p.until||'',p.cat,p.country,p.region].join('\t')).join('\n'):''}
async function msave(){const products=$('mcsv').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const c=l.split(l.includes('\t')?'\t':',').map(x=>x.trim());return{n:c[0],u:c[1]||'',p:c[2]||'',was:c[3]||'',until:c[4]||'',cat:c[5]||'',country:c[6]||'',region:c[7]||''}});
try{const r=await api('/api/admin/merchant',{method:'POST',body:JSON.stringify({id:$('mid').value.trim(),name:$('mnm').value.trim(),url:$('murl').value.trim(),products})});$('mmsg').textContent='已儲存 '+r.products+' 款';await mload();$('msel').value=$('mid').value.trim();}catch(e){$('mmsg').textContent='失敗 '+e.message+' (代號 / https 網址要正確)'}}
async function mdel(){const id=$('msel').value;if(!id||!confirm('刪除商家 '+id+'？'))return;await api('/api/admin/merchant/delete',{method:'POST',body:JSON.stringify({id})});await mload();mfill()}
async function mod(a,id){if(a==='remove'&&!confirm('確定移除？'))return;await api('/api/admin/explore/'+a,{method:'POST',body:JSON.stringify({id})});load()}
async function ban(off){const e=$('bem').value.trim();if(!e)return;try{await api('/api/admin/ban',{method:'POST',body:JSON.stringify({email:e,reason:$('brs').value,off:!!off})});$('bmsg').textContent=(off?'已解封 ':'已封鎖 ')+e}catch(x){$('bmsg').textContent='失敗 '+x.message}}
if(T){$('tok').value=T;go()}
</script></body></html>
