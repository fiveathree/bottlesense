<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BottleSense — Know what to do with it</title>
  
  <!-- Favicon 黑金酒瓶內嵌向量圖示 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%2311120D' stroke='%23D4AF37' stroke-width='2'/><path d='M14 8h4v4l2 3v9h-8v-9l2-3z' fill='%23D4AF37'/></svg>" type="image/svg+xml">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2311120D'/><path d='M14 7h4v4l2.5 3.5v10.5h-9v-10.5l2.5-3.5z' fill='%23D4AF37'/></svg>">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Google Fonts 免費字體組 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+TC:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="wordmark">BOTTLE<span>.</span></div>
        <div class="tagline">know what to do with it</div>
      </div>
      <div class="top-actions">
        <!-- 繁英轉換按鈕 -->
        <button class="lang-switch-btn" id="langSwitchBtn" onclick="toggleLanguage()">EN</button>
        <!-- 設定按鈕 -->
        <button class="icon-btn" onclick="renderSettings()" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        </button>
      </div>
    </header>

    <main id="main"></main>

    <nav class="bottomnav">
      <button class="navbtn" id="nav-home" onclick="goHome()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/></svg>
        <span data-i18n="nav_scan">辨識</span>
      </button>
      <button class="navbtn" id="nav-cellar" onclick="renderCellar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3v18M15 3v18"/></svg>
        <span data-i18n="nav_cellar">酒櫃</span>
      </button>
      <button class="navbtn" id="nav-explore" onclick="renderExplore()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2 6.4-6.4 2 2-6.4z"/></svg>
        <span data-i18n="nav_explore">探索</span>
      </button>
    </nav>
  </div>

  <div id="modal-container"></div>
  <div id="toast-container"></div>
  
  <!-- 拍照對位校準 HUD 模態框 -->
  <div id="crop-modal" class="crop-modal" style="display: none;">
    <div class="crop-header">
      <button class="btn btn-ghost btn-sm" onclick="closeCropModal()">取消</button>
      <span class="crop-title" data-i18n="crop_hint">雙指縮放拖曳對準酒瓶</span>
      <button class="btn btn-primary btn-sm" onclick="confirmCropAndScan()">確認辨識</button>
    </div>
    <div class="crop-viewport" id="cropViewport">
      <div class="crop-image-wrap" id="cropImageWrap">
        <img id="cropTargetImage" src="" alt="target" />
      </div>
      <!-- 酒瓶中央對齊 HUD 輔助外框 -->
      <div class="bottle-guide-frame">
        <div class="bottle-neck-line"></div>
        <div class="bottle-shoulder-curve"></div>
        <div class="bottle-body-box">
          <span class="guide-tag" data-i18n="guide_label_tag">請將酒標置於框內</span>
        </div>
      </div>
    </div>
    <div class="crop-footer">
      <span class="zoom-text">縮放:</span>
      <input type="range" id="zoomSlider" min="0.5" max="3" step="0.05" value="1" oninput="onSliderZoom(this.value)">
    </div>
  </div>

  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
  <input type="file" id="galleryInput" accept="image/*" style="display:none;">

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
