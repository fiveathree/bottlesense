<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bottle — Know what to do with it</title>

<meta name="apple-mobile-web-app-title" content="Bottle">
<meta name="application-name" content="Bottle">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #11120D;
    --surface: #181A12;
    --surface-2: #222518;
    --line: #2E3224;
    --gold: #D4AF37;
    --gold-dim: #8A7332;
    --wine: #8C2A3A;
    --wine-bright: #B8394D;
    --green-ok: #6E9265;
    --cyan-glow: #38bdf8;
    --purple-glow: #c084fc;
    --text: #ECE6D6;
    --text-muted: #9A9985;
    --text-faint: #5E5D4E;
    --radius: 14px;
    --serif: 'Fraunces', serif;
    --sans: 'Inter', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(120% 140% at 50% -10%, #1A1D13 0%, var(--bg) 60%);
    color: var(--text);
    font-family: var(--sans);
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 22px 14px;
  }
  .wordmark{
    font-family: var(--serif);
    font-weight:600;
    font-size:22px;
    letter-spacing:0.5px;
    color:var(--text);
  }
  .wordmark span{ color: var(--gold); }
  .tagline{
    font-size:10px;
    color:var(--text-faint);
    font-family: var(--mono);
    letter-spacing:0.6px;
    text-transform:uppercase;
    margin-top:2px;
  }
  .top-actions{ display:flex; gap:8px; align-items:center; }
  .icon-btn{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    background:var(--surface); color:var(--text-muted); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn svg{ width:16px; height:16px; }
  .lang-btn{
    font-family: var(--mono);
    font-size: 11px;
    border-radius: 999px;
    padding: 5px 11px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--gold);
    cursor: pointer;
  }

  main{ flex:1; padding: 4px 20px 110px; overflow-y:auto; }
  .view{ animation: fadeIn .35s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-family:var(--sans); font-weight:600; font-size:14px; border-radius:999px; border:1px solid transparent;
    padding:12px 20px; cursor:pointer; transition: transform .15s ease; -webkit-tap-highlight-color: transparent;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--gold); color:#191A11; }
  .btn-ghost{ background:transparent; border-color: var(--line); color:var(--text); }
  .btn-wine{ background: var(--wine); color:#F3E4E4; }
  .btn-block{ width:100%; }

  .scan-hero{
    margin-top:14px; border:1px solid var(--line); border-radius: 20px;
    padding: 28px 18px 22px; background: linear-gradient(165deg, var(--surface) 0%, #161810 100%); text-align:center;
  }
  .scan-hero h1{ font-family:var(--serif); font-weight:600; font-size:24px; line-height:1.25; margin-bottom:8px; }
  .scan-hero p{ color:var(--text-muted); font-size:12.5px; line-height:1.5; max-width:320px; margin:0 auto 20px; }
  .scan-center-box{ display:flex; flex-direction:column; align-items:center; justify-content:center; margin-bottom:6px; }
  .scan-btn{
    width:76px; height:76px; border-radius:50%; background: var(--gold); display:flex; align-items:center; justify-content:center;
    cursor:pointer; border:none; box-shadow: 0 0 0 6px rgba(212,175,55,0.1), 0 10px 26px -6px rgba(212,175,55,0.35);
    transition: transform .15s ease; margin-bottom:12px;
  }
  .scan-btn:active{ transform: scale(0.94); }
  .scan-btn svg{ width:30px; height:30px; }
  .upload-subtext{ font-size:12px; color:var(--text-muted); text-decoration:underline; cursor:pointer; font-family:var(--sans); }

  .stat-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:16px; }
  .stat-card{ background: var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center; cursor:pointer; }
  .stat-num{ font-family:var(--serif); font-size:22px; font-weight:600; }
  .stat-label{ font-size:10px; color:var(--text-faint); font-family:var(--mono); text-transform:uppercase; margin-top:2px;}

  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin: 24px 0 12px; }
  .section-head h2{ font-family:var(--serif); font-size:16px; font-weight:600; }
  .section-head a{ font-size:12px; color:var(--gold-dim); cursor:pointer; font-family:var(--mono); }

  .cellar-scene-tabs{ display:grid; grid-template-columns: repeat(4, 1fr); gap:6px; margin-bottom:14px; }
  .scene-tab{
    background: var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:8px 4px; text-align:center; cursor:pointer; transition: all .2s ease;
  }
  .scene-tab .scene-icon{ font-size:18px; margin-bottom:2px; display:block; }
  .scene-tab .scene-name{ font-size:10px; font-weight:600; }
  .scene-tab .scene-count{ font-size:9px; font-family:var(--mono); color:var(--text-faint); margin-top:2px; }
  .scene-tab.active-cooler{ background: linear-gradient(180deg, #132431 0%, #0d1720 100%); border-color: var(--cyan-glow); }
  .scene-tab.active-cooler .scene-name{ color: var(--cyan-glow); }
  .scene-tab.active-wood{ background: linear-gradient(180deg, #2b1f14 0%, #1a130b 100%); border-color: #d97706; }
  .scene-tab.active-wood .scene-name{ color: #fbbf24; }
  .scene-tab.active-bar{ background: linear-gradient(180deg, #242426 0%, #161617 100%); border-color: var(--gold); }
  .scene-tab.active-bar .scene-name{ color: var(--gold); }
  .scene-tab.active-wish{ background: linear-gradient(180deg, #28182b 0%, #170d19 100%); border-color: var(--purple-glow); }
  .scene-tab.active-wish .scene-name{ color: var(--purple-glow); }

  .filter-bar{ display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; margin-bottom:10px; scrollbar-width:none; }
  .filter-bar::-webkit-scrollbar{ display:none; }
  .filter-chip{
    padding:4px 10px; background:var(--surface); border:1px solid var(--line); border-radius:999px;
    font-size:11px; font-family:var(--sans); color:var(--text-muted); white-space:nowrap; cursor:pointer;
  }
  .filter-chip.active{ background:var(--gold); color:#191A11; border-color:var(--gold); font-weight:600; }

  .shelf-container{ border-radius:16px; padding:16px 14px 20px; position:relative; overflow:hidden; margin-bottom:20px; }
  .shelf-cooler{ background: radial-gradient(100% 120% at 50% 0%, #162a3b 0%, #0a1017 100%); border: 1px solid rgba(56,189,248,0.3); }
  .shelf-cooler .shelf-beam{ height:6px; background: linear-gradient(90deg, #1e3a53, #38bdf8, #1e3a53); border-radius:3px; margin:16px 0; }
  .shelf-wood{ background: linear-gradient(180deg, #2c1b10 0%, #180e08 100%); border: 1px solid #63391d; }
  .shelf-wood .shelf-beam{ height:9px; background: linear-gradient(180deg, #874921 0%, #4a260f 100%); border-radius:4px; margin:16px 0; }
  .shelf-bar{ background: radial-gradient(80% 100% at 50% 0%, #292a2d 0%, #101114 100%); border: 1px solid #45474e; }
  .shelf-bar .shelf-beam{ height:8px; background: linear-gradient(90deg, #333, #777, #333); border-radius:4px; margin:16px 0; }
  .shelf-wish{ background: radial-gradient(80% 100% at 50% 0%, #2c1830 0%, #120914 100%); border: 1px solid rgba(192,132,252,0.35); }
  .shelf-wish .shelf-beam{ height:6px; background: linear-gradient(90deg, #3d1c47, #c084fc, #3d1c47); border-radius:3px; margin:16px 0; }

  .bottle-card{
    display:flex; gap:12px; align-items:center; background: rgba(20,22,16,0.72); backdrop-filter: blur(8px);
    border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:12px; margin-bottom:12px; cursor:pointer;
  }
  .bottle-card:hover{ border-color: var(--gold); }
  .bottle-photo-box{
    width:58px; height:76px; border-radius:8px; overflow:hidden; background:#000; flex-shrink:0; border: 1px solid rgba(255,255,255,0.12);
  }
  .bottle-photo-box img{ width:100%; height:100%; object-fit:cover; }
  .bottle-photo-box .emoji-fallback{ display:flex; align-items:center; justify-content:center; height:100%; font-size:26px; }
  .bottle-info{ flex:1; min-width:0; }
  .bottle-name{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bottle-sub{ font-size:11px; color:var(--text-muted); margin-top:2px; font-family:var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  
  .tag-cluster{ display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
  .tag-badge{
    font-size:9.5px; padding:2px 6px; border-radius:4px; font-family:var(--sans);
    background:rgba(212,175,55,0.12); color:var(--gold); border:1px solid rgba(212,175,55,0.25);
  }
  .tag-badge.secondary{ background:rgba(255,255,255,0.05); color:var(--text-muted); border-color:rgba(255,255,255,0.1); }
  .tag-pill{ font-size:9.5px; font-family:var(--mono); padding:2px 7px; border-radius:4px; text-transform:uppercase; }
  .tag-unopened{ background: rgba(56,189,248,0.15); color: var(--cyan-glow); }
  .tag-opened{ background: rgba(251,191,36,0.15); color: #fbbf24; }
  .tag-finished{ background: rgba(255,255,255,0.1); color: var(--text-muted); }
  .tag-wishlist{ background: rgba(192,132,252,0.15); color: var(--purple-glow); }

  .detail-photo-hero{
    width:100%; height:230px; border-radius:16px; overflow:hidden; margin:14px 0; border:1px solid var(--line);
    background:#080906; display:flex; justify-content:center; align-items:center;
  }
  .detail-photo-hero img{ width:100%; height:100%; object-fit:contain; }

  /* Telegram 風格紙飛機分享按鈕 */
  .share-plane-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background: rgba(212,175,55,0.12); border: 1px solid var(--gold); border-radius: 999px;
    color: var(--gold); padding: 6px 14px; font-size: 11.5px; font-family: var(--mono); cursor: pointer;
    transition: all .15s ease;
  }
  .share-plane-btn:active{ transform: scale(0.96); }
  .share-plane-btn svg{ width:14px; height:14px; fill:currentColor; }

  .destination-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:14px; }
  .dest-card{ background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 10px; text-align:center; cursor:pointer; }
  .dest-card .icon{ font-size:24px; margin-bottom:5px; display:block; }
  .dest-card .title{ font-size:12.5px; font-weight:600; }
  .dest-card .desc{ font-size:9.5px; color:var(--text-muted); margin-top:2px; }

  .wish-input-box{ margin-top:14px; background: var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .field-label{ font-size:11px; font-family:var(--mono); color:var(--text-faint); margin-bottom:5px; }
  .text-input{
    width:100%; background:var(--surface-2); border:1px solid var(--line);
    border-radius:8px; padding:9px; color:var(--text); font-family:var(--sans); font-size:13px; outline:none; margin-bottom:8px;
  }
  textarea.text-input{ resize:vertical; min-height:64px; }
  .tag-edit-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:8px; }

  .empty-shelf{ text-align:center; padding: 36px 10px; color: var(--text-faint); font-size:12.5px; line-height:1.6; }
  .loading-view{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding-top:60px; text-align:center; }
  .loading-ring{ width:64px; height:64px; border-radius:50%; border:2px solid var(--line); border-top-color: var(--gold); animation: spin 1s linear infinite; margin-bottom:20px; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .preview-thumb{ width:120px; height:160px; object-fit:cover; border-radius:10px; margin-bottom:20px; border:1px solid var(--line); }

  .label-card{
    margin-top:14px; border-radius:18px; border:1px solid var(--line);
    background: linear-gradient(180deg, var(--surface) 0%, #161810 100%);
    padding:22px 18px; position:relative; overflow:hidden;
  }
  .label-card::after{ content:""; position:absolute; left:0; right:0; top:0; height:3px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .confidence-seal{
    position:absolute; top:16px; right:16px; width:50px; height:50px; border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--mono); border: 2px solid currentColor;
  }
  .seal-high{ color: var(--green-ok); } .seal-medium{ color: var(--gold); } .seal-low{ color: var(--wine-bright); }
  .seal-pct{ font-size:13px; font-weight:600; line-height:1; }
  .seal-label{ font-size:7px; letter-spacing:.5px; text-transform:uppercase; margin-top:2px; }
  .label-eyebrow{ font-family:var(--mono); font-size:10px; color:var(--gold-dim); text-transform:uppercase; margin-bottom:5px;}
  .label-name{ font-family:var(--serif); font-size:21px; font-weight:600; line-height:1.2; max-width:76%; margin-bottom:4px;}
  .label-sub{ font-size:12px; color:var(--text-muted); max-width:76%; margin-bottom:12px;}
  .label-facts{ display:grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; padding-top:12px; border-top:1px dashed var(--line); }
  .fact-label{ font-family:var(--mono); font-size:9px; color:var(--text-faint); }
  .fact-value{ font-family:var(--mono); font-size:12px; color:var(--text); margin-top:2px; }

  .radar-wrap{ margin-top:14px; background: var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px 14px; display:flex; flex-direction:column; align-items:center; }
  .radar-wrap h3{ font-family:var(--serif); font-size:15px; font-weight:600; align-self:flex-start; margin-bottom:10px;}
  .radar-legend{ display:grid; grid-template-columns: 1fr 1fr; gap:6px 12px; width:100%; margin-top:12px; }
  .legend-row{ display:flex; align-items:center; justify-content:space-between; font-size:11px; }
  .legend-row .dim{ color:var(--text-muted); } .legend-row .val{ font-family:var(--mono); color:var(--gold); }

  .rec-card{ margin-top:14px; background: var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 16px 6px; }
  .rec-card h3{ font-family:var(--serif); font-size:15px; font-weight:600; margin-bottom:4px;}
  .rec-reason{ font-size:12px; color:var(--text-muted); line-height:1.5; margin-bottom:12px; }
  .action-item{ display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  .action-rank{ font-family:var(--serif); font-size:16px; color:var(--gold); width:18px; flex-shrink:0; }
  .action-icon{ font-size:18px; flex-shrink:0; }
  .action-body{ flex:1; }
  .action-title{ font-size:13px; font-weight:600; text-transform:capitalize; }
  .action-reason{ font-size:11px; color:var(--text-faint); margin-top:2px; }

  .info-block{ margin-top:14px; background: var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .info-block h3{ font-family:var(--serif); font-size:14.5px; font-weight:600; margin-bottom:8px;}
  .storage-row{ display:flex; gap:10px; margin-bottom:6px; }
  .storage-tag{ font-family:var(--mono); font-size:10px; text-transform:uppercase; color:var(--gold); flex-shrink:0; width:68px; }
  .storage-desc{ font-size:12px; color:var(--text-muted); line-height:1.5; }
  .pairing-pill{ display:inline-block; font-size:11px; padding:6px 12px; border-radius:999px; border:1px solid var(--line); color:var(--text-muted); margin:0 5px 6px 0; }

  .status-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .status-btn{
    font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.4px;
    padding:8px 12px; border-radius:999px; border:1px solid var(--line); color:var(--text-muted); cursor:pointer; background:transparent;
  }
  .status-btn.active{ border-color:var(--gold); color:var(--gold); font-weight:600; background:rgba(212,175,55,0.08); }

  .star-row{ display:flex; gap:8px; margin-top:6px; }
  .star-btn{ background:none; border:none; cursor:pointer; font-size:24px; color: var(--line); opacity:.5; }
  .star-btn.filled{ color: var(--gold); opacity:1; }

  .bottomnav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
    display:flex; background: rgba(17,18,13,0.94); backdrop-filter: blur(12px); border-top:1px solid var(--line);
    padding: 10px 18px calc(10px + env(safe-area-inset-bottom));
  }
  .navbtn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; cursor:pointer; color:var(--text-faint); font-family:var(--mono); font-size:9.5px; text-transform:uppercase;
  }
  .navbtn.active{ color: var(--gold); }
  .navbtn svg{ width:20px; height:20px; }
  .back-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; color:var(--text-muted); font-size:13px; }
  .error-box{ background: rgba(140,42,58,0.12); border:1px solid var(--wine); color:#E8B9C0; border-radius:12px; padding:12px 14px; font-size:12px; margin-top:14px; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.78); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; z-index:999; padding:20px;
  }
  .modal-card{
    background:var(--surface); border:1px solid var(--line); border-radius:18px;
    padding:24px 20px; width:100%; max-width:380px; text-align:center;
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div>
      <div class="wordmark">BOTTLE<span>.</span></div>
      <div class="tagline" id="txt-tagline">know what to do with it</div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" onclick="renderSettings()" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </button>
      <button class="lang-btn" onclick="toggleLang()" id="btn-lang">EN</button>
    </div>
  </div>

  <main id="main"></main>

  <nav class="bottomnav" id="bottomnav">
    <button class="navbtn" id="nav-home" onclick="goHome()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/></svg>
      <span id="nav-lbl-scan">辨識</span>
    </button>
    <button class="navbtn" id="nav-cellar" onclick="renderCellar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3v18M15 3v18"/></svg>
      <span id="nav-lbl-cellar">酒櫃</span>

/* ---------------- IndexedDB 本地儲存庫 ---------------- */
const DB_NAME = 'BottleSenseDB_V6';
const DB_VERSION = 1;
const STORE_NAME = 'bottles';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function loadCellarFromDB() {
  try {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.getAll();
      req.onsuccess = () => {
        cellar = (req.result || []).sort((a,b)=> (b.addedAt||0) - (a.addedAt||0));
        resolve();
      };
      req.onerror = () => { cellar = []; resolve(); };
    });
  } catch(e) { cellar = []; }
}

async function saveBottleToDB(bottle) {
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(bottle);
    syncToCloudKV();
  } catch(e) { console.error('DB write error', e); }
}

async function deleteBottleFromDB(id) {
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(id);
    syncToCloudKV();
  } catch(e) { console.error('DB delete error', e); }
}

/* ---------------- 背景自動同步至 Cloudflare KV ---------------- */
async function syncToCloudKV() {
  if(!mySyncKey || !cellar) return;
  try {
    await fetch(`${WORKER_API_URL}/api/sync`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ syncKey: mySyncKey, cellar: cellar })
    });
  } catch(e) { console.warn('Cloud sync offline', e); }
}

/* ---------------- GPS ---------------- */
function getCurrentGPS() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, time: Date.now() }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 5000 }
    );
  });
}

/* ---------- 酒卡 ---------- */
function bottleCardHtml(b){
  const idf = b.identification || {};
  const tags = b.tags || {
    category: idf.category || '酒類',
    country: idf.country || '',
    region: idf.region || '',
    vintage: idf.vintage || ''
  };

  const name = idf.name || idf.producer || 'Unknown Bottle';
  const regionText = [tags.country, tags.region].filter(Boolean).join(' · ') || '未設定產區';
  const vintageText = tags.vintage || '未設定年份';

  let tagClass = 'tag-unopened';
  let tagText = '未開封';
  if(b.status === 'opened') { tagClass = 'tag-opened'; tagText = '已開瓶'; }
  else if(b.status === 'wishlist') { tagClass = 'tag-wishlist'; tagText = b.wishPrice ? `${b.wishPrice}` : 'WISH'; }
  else if(['finished','gifted','sold'].includes(b.status)) { tagClass = 'tag-finished'; tagText = b.status.toUpperCase(); }

  const photoHtml = b.image ? `<img src="${b.image}" alt="${name}">` : `<div class="emoji-fallback">${categoryEmoji(tags.category)}</div>`;

  return `
    <div class="bottle-card" onclick="renderDetail('${b.id}')">
      <div class="bottle-photo-box">
        ${photoHtml}
      </div>
      <div class="bottle-info">
        <div class="bottle-name">${escapeHtml(name)}</div>
        <div class="bottle-sub">${escapeHtml(idf.producer || '')}</div>
        
        <div class="tag-cluster">
          <span class="tag-badge">${escapeHtml(tags.category)}</span>
          <span class="tag-badge secondary">${escapeHtml(regionText)}</span>
          <span class="tag-badge secondary">${escapeHtml(vintageText)}</span>
          <span class="tag-pill ${tagClass}" style="margin-left:auto;">${tagText}</span>
        </div>
      </div>
    </div>
  `;
}

function categoryEmoji(cat){
  const c = (cat||'').toLowerCase();
  if(c.includes('威士忌')||c.includes('whisky')) return '🥃';
  if(c.includes('紅酒')||c.includes('白酒')||c.includes('wine')) return '🍷';
  if(c.includes('氣泡酒')||c.includes('香檳')||c.includes('champagne')) return '🍾';
  if(c.includes('清酒')||c.includes('sake')||c.includes('泡盛')) return '🍶';
  if(c.includes('啤酒')||c.includes('beer')) return '🍺';
  return '🍷';
}

/* ---------------- 拍照與相片處理 ---------------- */
async function handleFileSelect(e) {
  const file = e.target.files[0];
  if(!file) return;
  e.target.value = '';
  try {
    const dataUrl = await compressImage(file, 1280, 0.85);
    await runScan(dataUrl);
  } catch (err) {
    const dataUrl = await fileToDataUrl(file);
    await runScan(dataUrl);
  }
}

document.getElementById('cameraInput').addEventListener('change', handleFileSelect);
document.getElementById('galleryInput').addEventListener('change', handleFileSelect);

function fileToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = ()=> reject(new Error('read failed'));
    r.readAsDataURL(file);
  });
}

function compressImage(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event)=>{
      const img = new Image();
      img.src = event.target.result;
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        let width = img.width, height = img.height;
        if(width > maxWidth){
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = (err)=> reject(err);
    };
    reader.onerror = (err)=> reject(err);
  });
}

/* ---------------- 呼叫 Worker 分析 ---------------- */
async function runScan(dataUrl){
  renderLoading(dataUrl);
  const messages = currentLang === 'zh' 
    ? ["正在辨識酒標與生成自動標籤...", "正在分析產區、國家與年份...", "正在計算價值地圖...", "正在生成決策建議..."]
    : ["Recognizing label & generating tags...", "Analyzing terroir, country & vintage...", "Calculating value map...", "Generating suggestions..."];
  let mi = 0;
  const loadingInterval = setInterval(()=>{
    mi = (mi+1) % messages.length;
    const el = document.getElementById('loading-text');
    if(el) el.textContent = messages[mi];
  }, 1400);

  try{
    const [header, base64Data] = dataUrl.split(',');
    const mediaTypeMatch = header.match(/data:(.*);base64/);
    const mediaType = mediaTypeMatch ? mediaTypeMatch[1] : 'image/jpeg';

    const response = await fetch(`${WORKER_API_URL}/api/scan`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: base64Data, mediaType: mediaType })
    });

    if(!response.ok){
      throw new Error('API request failed: ' + response.status);
    }

    const parsed = await response.json();
    clearInterval(loadingInterval);
    currentScan = { raw: parsed, image: dataUrl, scannedAt: Date.now() };
    renderResult(currentScan);

  }catch(err){
    clearInterval(loadingInterval);
    console.error('Scan error:', err);
    renderScanError(dataUrl);
  }
}

function confidenceTier(conf){
  if(conf >= 80) return {cls:'seal-high', label:'high'};
  if(conf >= 55) return {cls:'seal-medium', label:'medium'};
  return {cls:'seal-low', label:'low'};
}

function renderRadar(vm){
  const order = ['mv','ql','dv','pv','sv','gv','cv','sto'];
  const labels = currentLang === 'zh' ? DIM_LABELS_ZH : DIM_LABELS_EN;
  const cx = 130, cy = 130, R = 95;
  const n = order.length;
  const points = order.map((k,i)=>{
    const angle = (Math.PI*2*i/n) - Math.PI/2;
    const val = Math.max(0, Math.min(100, vm[k] || 0));
    const r = (val/100) * R;
    return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
  });
  const axisPoints = order.map((k,i)=>{
    const angle = (Math.PI*2*i/n) - Math.PI/2;
    return [cx + R*Math.cos(angle), cy + R*Math.sin(angle)];
  });

  const polygon = points.map(p=>p.join(',')).join(' ');
  const rings = [0.25,0.5,0.75,1].map(f=>{
    const ringPts = order.map((k,i)=>{
      const angle = (Math.PI*2*i/n) - Math.PI/2;
      return [cx + R*f*Math.cos(angle), cy + R*f*Math.sin(angle)].join(',');
    }).join(' ');
    return `<polygon points="${ringPts}" fill="none" stroke="#2E3224" stroke-width="1"/>`;
  }).join('');
  const axes = axisPoints.map(p=>`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#2E3224" stroke-width="1"/>`).join('');

  const legend = order.map(k=>`
    <div class="legend-row"><span class="dim">${labels[k]}</span><span class="val">${vm[k] ?? '—'}</span></div>
  `).join('');

  return `
    <div class="radar-wrap">
      <h3>Bottle Value Map</h3>
      <svg width="260" height="260" viewBox="0 0 260 260">
        ${rings}
        ${axes}
        <polygon points="${polygon}" fill="rgba(212,175,55,0.25)" stroke="#D4AF37" stroke-width="2"/>
        ${points.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#D4AF37"/>`).join('')}
      </svg>
      <div class="radar-legend">${legend}</div>
    </div>
  `;
}

    buyDate: document.getElementById('diary-buy').value,
    drinkDate: document.getElementById('diary-drink').value,
    notes: document.getElementById('diary-notes').value.trim()
  };

  await saveBottleToDB(b);
  alert(currentLang === 'zh' ? '品飲日記與標籤已更新！' : 'Tags & Diary updated!');

}

async function setStatus(id, status){
  const b = cellar.find(x=>x.id===id);
  if(!b) return;
  b.status = status;
  await saveBottleToDB(b);
  if(status === 'unopened') currentScene = 'cooler';
  else if(status === 'opened') currentScene = 'wood';
  else if(status === 'finished') currentScene = 'bar';
  else currentScene = 'wishlist';
  renderDetail(id);
}

async function setRating(id, n){
  const b = cellar.find(x=>x.id===id);
  if(!b) return;
  b.personalRating = n;
  await saveBottleToDB(b);
  renderDetail(id);
}

async function removeBottle(id){
  cellar = cellar.filter(x=>x.id!==id);
  await deleteBottleFromDB(id);
  renderCellar();
}

          <button class="btn btn-ghost btn-block" onclick="closeModal()">${currentLang==='zh'?'取消':'Cancel'}</button>
          <button class="btn btn-primary btn-block" onclick="submitEmailModal()">${currentLang==='zh'?'確認送出':'Confirm'}</button>
        </div>
      </div>
    </div>
  `;

  window.submitEmailModal = ()=>{
    const val = document.getElementById('modal-email-input').value.trim();
    if(!val || !val.includes('@')){
      alert(currentLang==='zh'?'請輸入有效 Email':'Please enter a valid email');
      return;
    }
    closeModal();
    onSuccess(val);
  };
}

function closeModal(){
  document.getElementById('modal-container').innerHTML = '';
}

async function executeShare(b){
  b.shared = true;
  await saveBottleToDB(b);

  try {
    await fetch(`${WORKER_API_URL}/api/share`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bottle: b, userEmail: userEmail })
    });
  } catch(e){ console.warn('Community share failed', e); }

  const name = b.identification?.name || 'My Bottle';
  const tags = b.tags || {};
  const tagDesc = [tags.category, tags.country, tags.region, tags.vintage].filter(Boolean).join(' | ');
  const ratingText = b.personalRating ? `Rating: ${'★'.repeat(b.personalRating)} (${b.personalRating}/5)\n` : '';
  const noteText = b.diary?.notes ? `Comments: "${b.diary.notes}"\n` : '';
  const shareText = `🍾 BottleSense Wine Tasting:\n${name}\n[${tagDesc}]\n${ratingText}${noteText}Tracked with BottleSense.`;

  if (navigator.share) {
    try {
      await navigator.share({ title: name, text: shareText, url: window.location.href });
    } catch(err){}
  } else {
    navigator.clipboard.writeText(shareText);
    alert(currentLang === 'zh' ? '已發布至 Explore 並複製酒評至剪貼簿！' : 'Published to Explore & copied to clipboard!');
  }
}

async function shareCurrentShelf(){
  const count = cellar.filter(b=>b.status===currentScene).length;
  const sceneName = currentScene.toUpperCase();
  const shareText = `🍷 My BottleSense Cellar:\nSpace: [${sceneName}]\nCurrently holding ${count} curated bottles.\nCheck out my collection on BottleSense!`;

  if (navigator.share) {
    try {
      await navigator.share({ title: 'My Wine Cellar', text: shareText, url: window.location.href });
    } catch(err){}
  } else {
    navigator.clipboard.writeText(shareText);
    alert(currentLang === 'zh' ? '已複製酒架分享內容至剪貼簿！' : 'Cellar list copied to clipboard!');
  }
}

/* ---------------- Explore 探索 (連線 Cloudflare KV 社群評價池) ---------------- */
async function renderExplore(){
  setActiveNav('nav-explore');
  const t = I18N[currentLang];

  document.getElementById('main').innerHTML = `
    <div class="view">
      <div class="section-head" style="margin-top:8px;">
        <h2>${t.exploreTitle}</h2>
      </div>
      <div class="info-block" style="margin-bottom:14px; border-color:var(--gold);">
        <div class="storage-desc">${t.exploreDesc}</div>
      </div>
      <div id="explore-feed" style="text-align:center; padding:30px 10px; color:var(--text-muted); font-size:12px;">
        載入中...
      </div>
    </div>
  `;

  try {
    const res = await fetch(`${WORKER_API_URL}/api/explore`);
    const publicFeed = res.ok ? await res.json() : [];

    const feedEl = document.getElementById('explore-feed');
    if(!feedEl) return;

    if(!publicFeed.length){
      feedEl.innerHTML = `<div class="empty-shelf">${t.noExplore}</div>`;
      return;
    }

    feedEl.innerHTML = publicFeed.map(b => `
      <div class="bottle-card" style="text-align:left;">
        <div class="bottle-photo-box">
          ${b.image ? `<img src="${b.image}">` : `<div class="emoji-fallback">🍷</div>`}
        </div>
        <div class="bottle-info">
          <div class="bottle-name">${escapeHtml(b.identification?.name || 'Wine Note')}</div>
          <div style="font-size:11px; color:var(--gold); margin-top:2px; font-family:var(--mono);">
            ★ ${b.personalRating || 5}/5 ・ ${escapeHtml(b.author || '酒友匿名')}
          </div>
          <div class="tag-cluster" style="margin:4px 0;">
            <span class="tag-badge">${escapeHtml(b.tags?.category || '酒款')}</span>
            <span class="tag-badge secondary">${escapeHtml([b.tags?.country, b.tags?.region].filter(Boolean).join(' ') || '')}</span>
          </div>
          <div style="font-size:12px; color:var(--text-muted); margin-top:4px; font-style:italic;">
            "${escapeHtml(b.diary?.notes || '無筆記記錄')}"
          </div>
        </div>
      </div>
    `).join('');

  } catch(e){
    const feedEl = document.getElementById('explore-feed');
    if(feedEl) feedEl.innerHTML = `<div class="empty-shelf">${t.noExplore}</div>`;
  }
}

/* ---------------- Settings 設定與同步碼 ---------------- */
function renderSettings(){
  setActiveNav('');
  const t = I18N[currentLang];

  document.getElementById('main').innerHTML = `
    <div class="view">
      <div class="back-row" onclick="goHome()">← Back</div>
      <div class="section-head" style="margin-top:4px;">
        <h2>${t.settingsTitle}</h2>
      </div>

      <div class="info-block" style="border-color:var(--gold);">
        <h3 style="color:var(--gold);">${t.syncKeyLabel}</h3>
        <div class="storage-desc" style="margin-bottom:8px;">${t.syncKeyDesc}</div>
        <div style="font-family:var(--mono); font-size:15px; color:var(--gold); background:var(--surface-2); padding:10px; border-radius:8px; border:1px dashed var(--gold-dim); word-break:break-all;">
          ${mySyncKey}
        </div>
        <button class="btn btn-ghost btn-block" style="margin-top:10px; border-color:var(--gold); color:var(--gold);" onclick="copySyncKey()">
          ${t.copyBtn}
        </button>
      </div>

      <div class="info-block">
        <h3>${t.restoreTitle}</h3>
        <input type="text" id="restore-key-input" class="text-input" placeholder="${t.restorePlaceholder}">
        <button class="btn btn-primary btn-block" onclick="restoreFromCloudKV()">
          ${t.restoreBtn}
        </button>
      </div>

      <div class="info-block">
        <div class="storage-desc">${t.pwaTip}</div>
      </div>
    </div>
  `;
}

function copySyncKey(){
  navigator.clipboard.writeText(mySyncKey);
  alert(currentLang === 'zh' ? '同步碼已複製！' : 'Sync Key copied!');
}

async function restoreFromCloudKV(){
  const key = document.getElementById('restore-key-input').value.trim();
  if(!key){
    alert(currentLang === 'zh' ? '請輸入同步碼' : 'Please enter a Sync Key');
    return;
  }
  try {
    const res = await fetch(`${WORKER_API_URL}/api/restore?key=${encodeURIComponent(key)}`);
    if(!res.ok){
      alert(currentLang === 'zh' ? '找不到此同步碼的雲端備份' : 'No cloud backup found for this key');
      return;
    }
    const restoredCellar = await res.json();
    if(Array.isArray(restoredCellar)){
      cellar = restoredCellar;
      mySyncKey = key;
      localStorage.setItem('bottlesense_sync_key', mySyncKey);
      
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      await store.clear();
      for(const b of cellar){
        store.put(b);
      }
      alert(currentLang === 'zh' ? '酒庫還原成功！' : 'Cellar restored successfully!');
      renderCellar();
    }
  } catch(e){
    alert(currentLang === 'zh' ? '還原失敗，請檢查網絡' : 'Restore failed, check connection');
  }
}

/* ---------------- utils ---------------- */
function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---------------- init ---------------- */
(async function init(){
  await loadCellarFromDB();
  updateNavLang();
  goHome();
})();
</script>
