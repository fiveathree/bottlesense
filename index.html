
        <!-- 金色發光精巧酒瓶邊框線 -->
        <path id="bottleCutoutPath" d="M 122,65 C 122,55 130,52 140,52 C 150,52 158,55 158,65 L 158,135 C 158,165 225,175 225,210 L 225,438 C 225,452 215,456 200,456 L 80,456 C 65,456 55,452 55,438 L 55,210 C 55,175 122,165 122,135 Z"
              fill="none" stroke="#D4AF37" stroke-width="2.2" stroke-linejoin="round"
              style="filter: drop-shadow(0 0 10px rgba(212,175,55,0.7));"/>

        <!-- 瓶身中央酒標對齊輔助虛線框 -->
        <rect id="bottleLabelGuide" x="68" y="228" width="144" height="190" rx="8"
              fill="none" stroke="rgba(212,175,55,0.55)" stroke-width="1.4" stroke-dasharray="5,4"/>

        <!-- 四個金色對準角標 (HUD Corner Marks) -->
        <path d="M 68,242 L 68,228 L 82,228" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
        <path d="M 212,242 L 212,228 L 198,228" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
        <path d="M 68,404 L 68,418 L 82,418" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
        <path d="M 212,404 L 212,418 L 198,418" fill="none" stroke="#D4AF37" stroke-width="2.5"/>

        <!-- 中央對準提示標籤 -->
        <g transform="translate(140, 323)">
          <rect x="-60" y="-11" width="120" height="22" rx="11" fill="rgba(0,0,0,0.85)" stroke="rgba(212,175,55,0.6)" stroke-width="1"/>
          <text text-anchor="middle" y="4" fill="#D4AF37" font-size="10.5" font-family="monospace">請將酒標置於框內</text>
        </g>
      </svg>

      <!-- 頂部懸浮不折行提示膠囊 -->
      <div class="crop-hud-hint">👆 雙指縮放或拖曳對準酒瓶</div>
    </div>

    <div class="crop-footer">
      <span class="zoom-text">縮放:</span>
      <input type="range" id="zoomSlider" min="0.5" max="3" step="0.05" value="1" oninput="onSliderZoom(this.value)">
    </div>
  </div>

  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
  <input type="file" id="galleryInput" accept="image/*" style="display:none;">

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
