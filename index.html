<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BottleSense — Know what to do with it</title>
  
  <!-- Favicon 黑金酒瓶內嵌向量圖示 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%2311120D' stroke='%23D4AF37' stroke-width='2'/><path d='M14 8h4v4l2 3v9h-8v-9l2-3z' fill='%23D4AF37'/></svg>" type="image/svg+xml">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2311120D'/><path d='M14 7h4v4l2.5 3.5v10.5h-9v-10.5l2.5-3.5z' fill='%23D4AF37'/></svg>">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Google Fonts 免費字體組 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+TC:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#11120D">
  <link rel="preload" as="image" href="Glowing_Gold_World_Map.webp">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="wordmark">BOTTLE<span>.</span></div>
        <div class="tagline" id="appTagline">know what to do with it</div>
      </div>
      <div class="top-actions">
        <!-- PWA 安裝按鈕 -->
        <button class="pwa-install-btn" id="pwaInstallBtn" onclick="showPwaInstallModal()" title="安裝為手機 App (Add to Home Screen)">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>安裝 App</span>
        </button>
        <!-- 繁英轉換按鈕 -->
        <button class="lang-switch-btn" id="langSwitchBtn" onclick="toggleLanguage()">EN</button>
        <!-- 設定按鈕 -->
        <button class="icon-btn" onclick="renderSettings()" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        </button>
      </div>
    </header>

    <main id="main"></main>

    <nav class="bottomnav">
      <button class="navbtn" id="nav-home" onclick="goHome()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/></svg>
        <span data-i18n="nav_scan">辨識</span>
      </button>
      <button class="navbtn" id="nav-cellar" onclick="renderCellar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3v18M15 3v18"/></svg>
        <span data-i18n="nav_cellar">酒櫃</span>
      </button>
      <button class="navbtn" id="nav-explore" onclick="renderExplore()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2 6.4-6.4 2 2-6.4z"/></svg>
        <span data-i18n="nav_explore">探索</span>
      </button>
    </nav>
  </div>

  <div id="modal-container"></div>
  <div id="toast-container"></div>
  
  <!-- 拍照對位校準 HUD 模態框 -->
    <!-- 拍照對位校準 HUD 模態框 (全面升級酒瓶 Silhouette 邊框與無折行排版) -->
  <div id="crop-modal" class="crop-modal" style="display: none;">
    <div class="crop-header">
      <button class="btn btn-ghost btn-sm" onclick="closeCropModal()">取消</button>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-ghost btn-sm" style="border-color:var(--gold-dim); color:var(--gold);" onclick="confirmFullScan()" title="不裁剪，直接發送整張照片辨識">全圖辨識</button>
        <button class="btn btn-primary btn-sm" onclick="confirmCropAndScan()">對焦辨識</button>
      </div>
    </div>
    
    <div class="crop-viewport" id="cropViewport">
      <div class="crop-image-wrap" id="cropImageWrap">
        <img id="cropTargetImage" src="" alt="target" />
      </div>

      <!-- 真實發光金色酒瓶 Silhouette HUD 對位框 -->
      <svg class="bottle-hud-svg" viewBox="0 0 280 500" preserveAspectRatio="xMidYMid meet">
        <defs>
          <mask id="hudBottleMask">
            <rect width="100%" height="100%" fill="white"/>
            <!-- 緊湊精緻酒瓶透空路徑 (縮小約25%，手持拍照不再擁擠) -->
            <path d="M 122,65 C 122,55 130,52 140,52 C 150,52 158,55 158,65 L 158,135 C 158,165 225,175 225,210 L 225,438 C 225,452 215,456 200,456 L 80,456 C 65,456 55,452 55,438 L 55,210 C 55,175 122,165 122,135 Z" fill="black"/>
          </mask>
        </defs>

        <!-- 周圍暗色半透明遮罩，只有酒瓶內部通透 -->
        <rect width="100%" height="100%" fill="rgba(0,0,0,0.72)" mask="url(#hudBottleMask)"/>

        <!-- 金色發光精巧酒瓶邊框線 -->
        <path id="bottleCutoutPath" d="M 122,65 C 122,55 130,52 140,52 C 150,52 158,55 158,65 L 158,135 C 158,165 225,175 225,210 L 225,438 C 225,452 215,456 200,456 L 80,456 C 65,456 55,452 55,438 L 55,210 C 55,175 122,165 122,135 Z"
              fill="none" stroke="#D4AF37" stroke-width="2.2" stroke-linejoin="round"
              style="filter: drop-shadow(0 0 10px rgba(212,175,55,0.7));"/>

        <!-- 瓶身中央酒標對齊輔助虛線框 -->
        <rect id="bottleLabelGuide" x="68" y="228" width="144" height="190" rx="8"
              fill="none" stroke="rgba(212,175,55,0.55)" stroke-width="1.4" stroke-dasharray="5,4"/>

        <!-- 四個金色對準角標 (HUD Corner Marks) -->
        <path d="M 68,242 L 68,228 L 82,228" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
        <path d="M 212,242 L 212,228 L 198,228" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
        <path d="M 68,404 L 68,418 L 82,418" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
        <path d="M 212,404 L 212,418 L 198,418" fill="none" stroke="#D4AF37" stroke-width="2.5"/>

        <!-- 中央對準提示標籤 -->
        <g transform="translate(140, 323)">
          <rect x="-60" y="-11" width="120" height="22" rx="11" fill="rgba(0,0,0,0.85)" stroke="rgba(212,175,55,0.6)" stroke-width="1"/>
          <text text-anchor="middle" y="4" fill="#D4AF37" font-size="10.5" font-family="monospace">請將酒標置於框內</text>
        </g>
      </svg>

      <!-- 頂部懸浮不折行提示膠囊 -->
      <div class="crop-hud-hint">👆 雙指縮放或拖曳對準酒瓶</div>
    </div>

    <div class="crop-footer">
      <span class="zoom-text">縮放:</span>
      <input type="range" id="zoomSlider" min="0.5" max="3" step="0.05" value="1" oninput="onSliderZoom(this.value)">
    </div>
  </div>

  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
  <input type="file" id="galleryInput" accept="image/*" style="display:none;">

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
