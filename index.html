<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BottleSense — Know what to do with it</title>
  
  <!-- Favicon 黑金酒瓶內嵌向量圖示 -->
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#11120D">
  <meta name="description" content="BottleSense - AI cellar manager for wine and spirits">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Google Fonts 免費字體組 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css?v=16">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand" role="button" tabindex="0" aria-label="BottleSense" onclick="goHome()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();goHome();}">
        <div class="wordmark">BOTTLE<span>.</span></div>
        <div class="tagline" id="appTagline">know what to do with it</div>
      </div>
      <div class="top-actions">
        <button class="lang-switch-btn" id="langSwitchBtn" aria-label="Switch language" onclick="toggleLanguage()">EN</button>
        <button class="icon-btn" onclick="openSettings()" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
          <span id="syncDot" class="sync-dot" data-state="ok" role="status" aria-live="polite"></span>
        </button>
      </div>
    </header>

    <main id="main"></main>

    <nav class="bottomnav">
      <button class="navbtn" id="nav-home" onclick="goHome()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/></svg>
        <span data-i18n="nav_scan">辨識</span>
      </button>
      <button class="navbtn" id="nav-cellar" onclick="renderCellar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3v18M15 3v18"/></svg>
        <span data-i18n="nav_cellar">酒櫃</span>
      </button>
      <button class="navbtn" id="nav-explore" onclick="renderExplore()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2 6.4-6.4 2 2-6.4z"/></svg>
        <span data-i18n="nav_explore">探索</span>
      </button>
    </nav>
  </div>

  <div id="modal-container"></div>
  <div id="toast-container"></div>
  
  <!-- 拍照對位校準 HUD 模態框 -->
  <div id="crop-modal" class="crop-modal" style="display: none;">
    <div class="crop-header" style="display:flex; justify-content:space-between; align-items:center; padding:10px 14px;">
      <button class="btn btn-ghost btn-sm" onclick="closeCropModal()" data-i18n="btn_cancel">取消</button>
      <div style="display:flex; gap:6px;">
        <button class="btn btn-ghost btn-sm" style="color:var(--text); border-color:var(--line); padding:6px 10px; font-size:12px;" onclick="confirmCropAndScan(true)" data-i18n="btn_full_scan">📷 全圖辨識</button>
        <button class="btn btn-primary btn-sm" style="padding:6px 12px; font-size:12px; font-weight:700;" onclick="confirmCropAndScan(false)" data-i18n="btn_focus_scan">🎯 對焦辨識</button>
      </div>
    </div>
    <div class="crop-viewport" id="cropViewport" style="position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden;">
      <div class="crop-image-wrap" id="cropImageWrap">
        <img id="cropTargetImage" src="" alt="target" />
      </div>
      <!-- 向量酒瓶發光輪廓 (SVG Cutout) -->
      <div class="bottle-guide-frame" style="position:absolute; inset:0; pointer-events:none; display:flex; align-items:center; justify-content:center;">
        <svg class="bottle-silhouette-svg" viewBox="0 0 260 420" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:230px; height:370px; filter:drop-shadow(0 0 8px rgba(212,175,55,0.4));">
          <!-- 瓶塞口 -->
          <rect x="115" y="10" width="30" height="18" rx="3" stroke="#D4AF37" stroke-width="2" fill="none"/>
          <!-- 細長瓶頸 -->
          <path d="M118 28 L118 100 L142 100 L142 28 Z" stroke="#D4AF37" stroke-width="2" fill="none"/>
          <!-- 波爾多瓶肩與圓柱瓶身與微弧瓶底 -->
          <path d="M118 100 C118 135 60 145 60 185 L60 380 C60 395 75 400 130 400 C185 400 200 395 200 380 L200 185 C200 145 142 135 142 100" stroke="#D4AF37" stroke-width="2" fill="none"/>
          <!-- 瓶身正中金色對焦直角標記 -->
          <path d="M95 235 L85 235 L85 245" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M165 235 L175 235 L175 245" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M95 325 L85 325 L85 315" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M165 325 L175 325 L175 315" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <div class="crop-footer">
      <span class="zoom-text" data-i18n="zoom_label">縮放:</span>
      <input type="range" id="zoomSlider" min="0.5" max="3" step="0.05" value="1" oninput="onSliderZoom(this.value)">
    </div>
  </div>

  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
  <input type="file" id="galleryInput" accept="image/*" style="display:none;">

  <script src="icons.js?v=16"></script>
  <script src="db.js?v=16"></script>
  <script src="app.js?v=16"></script>
</body>
</html>
