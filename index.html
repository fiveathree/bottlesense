<script>
const TELEGRAM_PLANE_SVG = `<svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>`;
const WORKER_API_URL = "https://bottlesense-api.fiveathree.workers.dev";

let cellar = [];
let currentScan = null;
let currentDetailId = null;
let currentScene = 'cooler'; // 'cooler' | 'wood' | 'bar' | 'wishlist' | 'favorite'

let mySyncKey = localStorage.getItem('bottlesense_sync_key') || '';
if(!mySyncKey){
  mySyncKey = 'BTL-' + Math.random().toString(36).substring(2,6).toUpperCase() + '-' + Math.random().toString(36).substring(2,6).toUpperCase();
  localStorage.setItem('bottlesense_sync_key', mySyncKey);
}

// 永久鎖定資料庫名稱
const DB_NAME = 'BottleSenseDB';
const DB_VERSION = 1;
const STORE_NAME = 'bottles';

function openDB(dbName = DB_NAME) {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(dbName);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

/* 自動整併撈回所有舊 DB */
async function loadCellarWithMigration() {
  const oldDbNames = ['BottleSenseDB', 'BottleSenseDB_V7', 'BottleSenseDB_V6', 'BottleSenseDB_V5', 'BottleSenseDB_V4', 'BottleSenseDB_V3'];
  let allFound = [];
  const seenIds = new Set();

  for (const name of oldDbNames) {
    try {
      const db = await openDB(name);
      if (db.objectStoreNames.contains(STORE_NAME)) {
        const items = await new Promise((res) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const req = tx.objectStore(STORE_NAME).getAll();
          req.onsuccess = () => res(req.result || []);
          req.onerror = () => res([]);
        });
        for (const item of items) {
          if (item && item.id && !seenIds.has(item.id)) {
            seenIds.add(item.id);
            allFound.push(item);
          }
        }
      }
    } catch(e){}
  }

  try {
    const mainDb = await openDB(DB_NAME);
    const tx = mainDb.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    for (const b of allFound) store.put(b);
  } catch(e){}

  cellar = allFound.sort((a,b)=> (b.addedAt||0) - (a.addedAt||0));
}

async function saveBottleToDB(bottle) {
  try {
    const db = await openDB(DB_NAME);
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(bottle);
    syncToCloudKV();
  } catch(e) {}
}

async function deleteBottleFromDB(id) {
  try {
    const db = await openDB(DB_NAME);
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(id);
    syncToCloudKV();
  } catch(e) {}
}

async function syncToCloudKV() {
  if(!mySyncKey || !cellar) return;
  try {
    await fetch(`${WORKER_API_URL}/api/sync`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ syncKey: mySyncKey, cellar: cellar })
    });
  } catch(e) {}
}

/* ---------------- 導航 ---------------- */
function setActiveNav(id){
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));
  const el = document.getElementById(id);
  if(el) el.classList.add('active');
}

function goHome(){ setActiveNav('nav-home'); renderHome(); }

function renderHome(){
  setActiveNav('nav-home');
  const countCooler = cellar.filter(b=>b.status==='unopened').length;
  const countWood = cellar.filter(b=>b.status==='opened').length;
  const countBar = cellar.filter(b=>['finished','gifted','sold'].includes(b.status)).length;
  const countWish = cellar.filter(b=>b.status==='wishlist').length;
  const countFav = cellar.filter(b=>b.isFavorite).length;

  document.getElementById('main').innerHTML = `
    <div class="view">

/* ---------------- 左右滑動手勢核心邏輯 (Touch & Mouse) ---------------- */
let swipedCardId = null;

function attachSwipeListeners(){
  const wrappers = document.querySelectorAll('.swipe-item-wrapper');
  wrappers.forEach(wrap => {
    const card = wrap.querySelector('.bottle-card');
    const id = wrap.id.replace('wrap-', '');

    let startX = 0, currentX = 0, isDragging = false;

    const onStart = (e) => {
      startX = e.touches ? e.touches[0].clientX : e.clientX;
      isDragging = true;
      card.style.transition = 'none';
    };

    const onMove = (e) => {
      if(!isDragging) return;
      currentX = e.touches ? e.touches[0].clientX : e.clientX;
      const diffX = currentX - startX;
      // 限制滑動最大距離 (-80px 到 80px)
      if (diffX > -100 && diffX < 100) {
        card.style.transform = `translateX(${diffX}px)`;
      }
    };

    const onEnd = (e) => {
      if(!isDragging) return;
      isDragging = false;
      card.style.transition = 'transform 0.25s ease';
      const diffX = currentX - startX;

      if (diffX > 45) {
        // 向右滑開 (露出星號)
        card.style.transform = 'translateX(76px)';
        swipedCardId = id;
      } else if (diffX < -45) {
        // 向左滑開 (露出叉叉)
        card.style.transform = 'translateX(-76px)';
        swipedCardId = id;
      } else {
        // 彈回原位
        card.style.transform = 'translateX(0px)';
        swipedCardId = null;
      }
    };

    card.addEventListener('touchstart', onStart, {passive: true});
    card.addEventListener('touchmove', onMove, {passive: true});
    card.addEventListener('touchend', onEnd);

    card.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);
  });
}

function onCardClick(e, id){
  const card = document.getElementById(`card-${id}`);
  // 如果處於滑開狀態，點擊卡片先收回
  if (card && card.style.transform && card.style.transform !== 'translateX(0px)') {
    e.stopPropagation();
    card.style.transform = 'translateX(0px)';
    swipedCardId = null;
    return;
  }
  renderDetail(id);
}

/* ---------------- 彈窗 1：加入 / 取消最愛 (Add to Favorite) ---------------- */
function confirmToggleFavorite(id){
  const b = cellar.find(x => x.id === id);
  if(!b) return;
  const isFav = !!b.isFavorite;
  const name = b.identification?.name || '此酒款';

  showModal({
    title: isFav ? '取消最愛？' : '加入最愛？',
    desc: isFav ? `是否將「${name}」從最愛收藏中移除？` : `是否將「${name}」加入⭐最愛心頭好收藏？`,
    confirmText: isFav ? '確認取消' : '加入最愛',
    confirmColor: 'var(--gold)',
    onConfirm: async () => {
      b.isFavorite = !isFav;
      await saveBottleToDB(b);
      closeModal();
      renderCellar();
    }
  });
}

/* ---------------- 彈窗 2：確認移除酒款 (Delete Bottle) ---------------- */
function confirmDeleteBottle(id){
  const b = cellar.find(x => x.id === id);
  if(!b) return;
  const name = b.identification?.name || '此酒款';

  showModal({
    title: '確定移除此酒？',
    desc: `將「${name}」從酒庫中永久移除，無法復原。`,
    confirmText: '確定移除',
    confirmColor: 'var(--wine-bright)',
    onConfirm: async () => {
      cellar = cellar.filter(x => x.id !== id);
      await deleteBottleFromDB(id);
      closeModal();
      renderCellar();
    }
  });
}

function showModal({ title, desc, confirmText, confirmColor, onConfirm }){
  const container = document.getElementById('modal-container');
  container.innerHTML = `
    <div class="modal-overlay" onclick="closeModal()">
      <div class="modal-card" onclick="event.stopPropagation()">

        <div style="font-size:12.5px; color:var(--text-muted); line-height:1.5; margin-bottom:18px;">${desc}</div>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-ghost btn-block" onclick="closeModal()">取消</button>
          <button class="btn btn-block" style="background:${confirmColor}; color:#111;" id="modal-confirm-btn">${confirmText}</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modal-confirm-btn').onclick = onConfirm;
}

function closeModal(){
  document.getElementById('modal-container').innerHTML = '';
}

/* ---------------- 詳情頁 (含 5 大空間切換) ---------------- */

  const statuses = [
    { key:'unopened', label:'⚡ 未飲' },
    { key:'opened', label:'🪵 已飲' },
    { key:'finished', label:'🥃 飲完' },
    { key:'wishlist', label:'🏷️ 想買' }
  ];

  document.getElementById('main').innerHTML = `
    <div class="view">
      <div class="back-row" onclick="renderCellar()">← 返回酒庫</div>
      <div class="detail-photo-hero">${b.image ? `<img src="${b.image}">` : '🍷'}</div>
      
      <div class="label-card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div class="label-name">${escapeHtml(idf.name || '酒款')}</div>
          <button class="icon-btn" onclick="toggleFavInDetail('${b.id}')" style="color:${b.isFavorite?'var(--gold)':'var(--text-muted)'};">
            ${b.isFavorite ? '★' : '☆'}
          </button>

        <div class="label-sub">${escapeHtml(idf.producer || '')} · ${escapeHtml(b.tags?.vintage || '')}</div>

            <div class="dest-card" style="${b.status===s.key?'border-color:var(--gold); color:var(--gold);':''}" onclick="moveStatus('${b.id}','${s.key}')">
              <div class="title">${s.label}</div>
            </div>
          `).join('')}

      </div>

      <div class="info-block">
        <h3>⭐ 評分與品飲筆記</h3>
        <div class="star-row">
          ${[1,2,3,4,5].map(n=>`<button class="star-btn ${b.personalRating>=n?'filled':''}" onclick="setRating('${b.id}',${n})">★</button>`).join('')}
        </div>
        <textarea id="dt-notes" class="text-input" style="height:70px; resize:none;">${b.diary?.notes || ''}</textarea>
        <button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="saveQuickNote('${b.id}')">儲存筆記</button>

}

async function toggleFavInDetail(id){
  const b = cellar.find(x => x.id === id);
  if(!b) return;
  b.isFavorite = !b.isFavorite;
  await saveBottleToDB(b);
  renderDetail(id);
}

async function moveStatus(id, newStatus){
  const b = cellar.find(x => x.id === id);
  if(!b) return;
  b.status = newStatus;
  await saveBottleToDB(b);
  renderDetail(id);
}

async function setRating(id, n){
  const b = cellar.find(x=>x.id===id);
  if(!b) return;
  b.personalRating = n;
  await saveBottleToDB(b);
  renderDetail(id);
}

async function saveQuickNote(id){
  const b = cellar.find(x => x.id === id);
  if(!b) return;
  if(!b.diary) b.diary = {};
  b.diary.notes = document.getElementById('dt-notes').value;
  await saveBottleToDB(b);
  alert("筆記已更新！");
}

/* ---------------- 拍照上傳並收納 (包含 5 大分類選擇) ---------------- */
document.getElementById('cameraInput').addEventListener('change', handleUpload);
document.getElementById('galleryInput').addEventListener('change', handleUpload);

async function handleUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    const dataUrl = ev.target.result;
    document.getElementById('main').innerHTML = `
      <div class="view loading-view">
        <div class="loading-ring"></div>
        <div style="font-size:13px; color:var(--gold);">AI 正在辨識酒標...</div>
      </div>
    `;
    try {
      const [head, b64] = dataUrl.split(',');
      const res = await fetch(`${WORKER_API_URL}/api/scan`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ image: b64, mediaType: 'image/jpeg' })
      });
      const parsed = await res.json();
      currentScan = {
        raw: parsed,
        image: dataUrl
      };
      renderScanDestinationSheet();
    } catch(err){
      alert("辨識失敗，請重試");
      goHome();
    }
  };
  reader.readAsDataURL(file);
}

function renderScanDestinationSheet(){
  const parsed = currentScan.raw;
  document.getElementById('main').innerHTML = `
    <div class="view">
      <div class="back-row" onclick="goHome()">← 取消</div>
      <div class="detail-photo-hero"><img src="${currentScan.image}"></div>
      
      <div class="info-block">
        <div style="font-family:var(--serif); font-size:16px; font-weight:600; color:var(--gold); margin-bottom:4px;">
          ${escapeHtml(parsed.id?.name || '已成功辨識')}
        </div>
        <div style="font-size:12px; color:var(--text-muted); margin-bottom:14px;">收納至哪個空間？</div>

        <div class="destination-grid">
          <div class="dest-card" onclick="saveNewBottle('unopened', false)"><div class="icon">⚡</div><div class="title">未飲</div></div>
          <div class="dest-card" onclick="saveNewBottle('opened', false)"><div class="icon">🪵</div><div class="title">已飲</div></div>
          <div class="dest-card" onclick="saveNewBottle('finished', false)"><div class="icon">🥃</div><div class="title">飲完</div></div>
          <div class="dest-card" onclick="saveNewBottle('wishlist', false)"><div class="icon">🏷️</div><div class="title">想買</div></div>
          <div class="dest-card" onclick="saveNewBottle('unopened', true)"><div class="icon">⭐</div><div class="title">未飲+最愛</div></div>
        </div>
      </div>
    </div>
  `;
}

async function saveNewBottle(status, isFav){
  const item = {
    id: 'b_' + Date.now(),
    status: status,
    isFavorite: isFav,
    image: currentScan.image,
    identification: currentScan.raw.id || {},
    tags: { category: currentScan.raw.id?.category || '酒類', vintage: currentScan.raw.id?.vintage || '' },
    addedAt: Date.now()
  };
  cellar.unshift(item);
  await saveBottleToDB(item);
  currentScene = isFav ? 'favorite' : status;
  renderCellar();
}

async function shareEntireCellar(){
  if(!cellar.length){ alert("酒櫃暫無酒款！"); return; }
  try {
    await fetch(`${WORKER_API_URL}/api/cellar/publish`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ syncKey: mySyncKey, cellar: cellar, ownerName: '品飲家' })
    });
    const shareUrl = `${window.location.origin}${window.location.pathname}?cellar=${mySyncKey}`;
    navigator.clipboard.writeText(shareUrl);
    alert(`專屬酒窖公開連結已複製至剪貼簿！\n發送給朋友即可瀏覽：\n${shareUrl}`);
  } catch(e){}
}

function escapeHtml(str){ return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  await loadCellarWithMigration();
  goHome();
