<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>Bottle — Know what to do with it</title>

<meta name="apple-mobile-web-app-title" content="Bottle">

<style>
  :root{
    --bg: #11120D;
    --surface: #181A12;
    --surface-2: #222518;
    --line: #2E3224;
    --gold: #D4AF37;
    --gold-dim: #8A7332;
    --wine: #8C2A3A;
    --wine-bright: #B8394D;
    --green-ok: #6E9265;
    --cyan-glow: #38bdf8;
    --text: #ECE6D6;
    --text-muted: #9A9985;
    --text-faint: #5E5D4E;
    --radius: 14px;
    --serif: 'Fraunces', serif;
    --sans: 'Inter', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(120% 140% at 50% -10%, #1A1D13 0%, var(--bg) 60%);
    color: var(--text);
    font-family: var(--sans);
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 22px 14px;
  }
  .wordmark{
    font-family: var(--serif);
    font-weight:600;
    font-size:22px;
    letter-spacing:0.5px;
    color:var(--text);
  }
  .wordmark span{ color: var(--gold); }
  .tagline{
    font-size:10.5px;
    color:var(--text-faint);
    font-family: var(--mono);
    letter-spacing:0.6px;
    text-transform:uppercase;
    margin-top:2px;
  }
  main{
    flex:1;
    padding: 4px 20px 110px;
    overflow-y:auto;
  }
  .view{ animation: fadeIn .35s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-family:var(--sans);
    font-weight:600;
    font-size:14.5px;
    border-radius:999px;
    border:1px solid transparent;
    padding:13px 22px;

    transition: transform .15s ease, opacity .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--gold); color:#191A11; }
  .btn-ghost{ background:transparent; border-color: var(--line); color:var(--text); }
  .btn-wine{ background: var(--wine); color:#F3E4E4; }
  .btn-block{ width:100%; }

  .scan-hero{
    margin-top:14px;
    border:1px solid var(--line);
    border-radius: 20px;
    padding: 28px 20px;
    background: linear-gradient(165deg, var(--surface) 0%, #161810 100%);
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .scan-hero h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:25px;
    line-height:1.25;
    margin-bottom:8px;
  }
  .scan-hero p{
    color:var(--text-muted);
    font-size:13px;
    line-height:1.5;
    max-width:320px;
    margin:0 auto 20px;
  }
  .scan-btn{
    width:72px; height:72px;
    border-radius:50%;
    background: var(--gold);
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 10px;
    cursor:pointer;
    border:none;
    box-shadow: 0 0 0 6px rgba(212,175,55,0.1), 0 10px 28px -6px rgba(212,175,55,0.35);
    transition: transform .15s ease;
  }
  .scan-btn:active{ transform: scale(0.94); }
  .scan-btn svg{ width:28px; height:28px; }
  .scan-cta-label{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color: var(--gold);
  }

  .stat-row{ display:flex; gap:10px; margin-top:16px; }
  .stat-card{
    flex:1; background: var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:12px 10px; text-align:center;

  .stat-num{ font-family:var(--serif); font-size:22px; font-weight:600; }
  .stat-label{ font-size:9.5px; color:var(--text-faint); font-family:var(--mono); text-transform:uppercase; letter-spacing:.5px; margin-top:2px;}

  .section-head{

  }
  .section-head h2{ font-family:var(--serif); font-size:16.5px; font-weight:600; }
  .section-head a{ font-size:12px; color:var(--gold-dim); cursor:pointer; font-family:var(--mono); }

  /* ---------- 沉浸式酒櫃切換標籤 ---------- */
  .cellar-scene-tabs{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap:8px;
    margin-bottom:18px;
  }
  .scene-tab{
    background: var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 6px;
    text-align:center;

  .scene-tab .scene-icon{ font-size:20px; margin-bottom:4px; display:block; }
  .scene-tab .scene-name{ font-size:11px; font-weight:600; font-family:var(--sans); }
  .scene-tab .scene-count{ font-size:9.5px; font-family:var(--mono); color:var(--text-faint); margin-top:2px; }
  
  .scene-tab.active-cooler{
    background: linear-gradient(180deg, #132431 0%, #0d1720 100%);
    border-color: var(--cyan-glow);
    box-shadow: 0 0 16px rgba(56,189,248,0.22);
  }
  .scene-tab.active-cooler .scene-name{ color: var(--cyan-glow); }

  .scene-tab.active-wood{
    background: linear-gradient(180deg, #2b1f14 0%, #1a130b 100%);
    border-color: #d97706;
    box-shadow: 0 0 16px rgba(217,119,6,0.22);

  .scene-tab.active-wood .scene-name{ color: #fbbf24; }

  .scene-tab.active-bar{

  /* ---------- 酒櫃展示棚架結構 (Shelf View) ---------- */

    border-radius:16px;
    padding:16px 14px 20px;
    position:relative;
    overflow:hidden;
    margin-bottom:20px;

  /* 電子酒櫃風格 */

    background: radial-gradient(100% 120% at 50% 0%, #162a3b 0%, #0a1017 100%);

  .shelf-cooler .shelf-beam{

    background: linear-gradient(90deg, #1e3a53, #38bdf8, #1e3a53);
    border-radius: 3px;
    margin: 16px 0;
    box-shadow: 0 0 8px rgba(56,189,248,0.4);

  /* 實木酒架風格 */
  .shelf-wood{
    background: linear-gradient(180deg, #2c1b10 0%, #180e08 100%);
    border: 1px solid #63391d;
    box-shadow: inset 0 0 25px rgba(0,0,0,0.6);

  .shelf-wood .shelf-beam{
    height: 10px;
    background: linear-gradient(180deg, #874921 0%, #4a260f 100%);
    border-radius: 4px;
    margin: 16px 0;
    box-shadow: 0 4px 6px rgba(0,0,0,0.5);
  }

  /* 吧台展示風格 */
  .shelf-bar{
    background: radial-gradient(80% 100% at 50% 0%, #292a2d 0%, #101114 100%);
    border: 1px solid #45474e;
    box-shadow: inset 0 0 30px rgba(255,255,255,0.03);
  }
  .shelf-bar .shelf-beam{
    height: 8px;
    background: linear-gradient(90deg, #333, #777, #333);
    border-radius: 4px;
    margin: 16px 0;
    box-shadow: 0 3px 8px rgba(0,0,0,0.6);
  }

  /* ---------- 酒瓶展示卡片 (Bottle Card with Real Photo) ---------- */
  .bottle-card{
    display:flex;
    gap:14px;
    align-items:center;
    background: rgba(20,22,16,0.7);
    backdrop-filter: blur(8px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;

    margin-bottom:12px;

  .bottle-tag-row{ display:flex; gap:6px; margin-top:6px; align-items:center; }

  .tag-opened{ background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
  .tag-finished{ background: rgba(255,255,255,0.1); color: var(--text-muted); }

  /* 詳情頁相片展示 */
  .detail-photo-hero{
    width:100%;
    height:240px;
    border-radius:16px;
    overflow:hidden;
    margin:14px 0;
    border:1px solid var(--line);
    background:#080906;
    display:flex;
    justify-content:center;
    align-items:center;
  }
  .detail-photo-hero img{
    width:100%; height:100%;
    object-fit:contain;
  }

  .empty-shelf{
    text-align:center;
    padding: 40px 10px;
    color: var(--text-faint);
    font-size:13px;
    line-height:1.6;

  /* 讀取畫面 */
  .loading-view{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding-top:60px; text-align:center; }
  .loading-ring{ width:66px; height:66px; border-radius:50%; border:2px solid var(--line); border-top-color: var(--gold); animation: spin 1s linear infinite; margin-bottom:20px; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .preview-thumb{ width:120px; height:160px; object-fit:cover; border-radius:10px; margin-bottom:22px; border:1px solid var(--line); }

  /* 卡片與雷達圖相關樣式 */
  .label-card{
    margin-top:14px; border-radius:18px; border:1px solid var(--line);
    background: linear-gradient(180deg, var(--surface) 0%, #161810 100%);

  .label-card::after{ content:""; position:absolute; left:0; right:0; top:0; height:3px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .confidence-seal{
    position:absolute; top:18px; right:18px; width:54px; height:54px; border-radius:50%;

  .seal-high{ color: var(--green-ok); } .seal-medium{ color: var(--gold); } .seal-low{ color: var(--wine-bright); }
  .seal-pct{ font-size:14px; font-weight:600; line-height:1; }
  .seal-label{ font-size:7px; letter-spacing:.5px; text-transform:uppercase; margin-top:2px; }
  .label-eyebrow{ font-family:var(--mono); font-size:10.5px; color:var(--gold-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;}
  .label-name{ font-family:var(--serif); font-size:22px; font-weight:600; line-height:1.2; max-width:76%; margin-bottom:4px;}
  .label-sub{ font-size:12.5px; color:var(--text-muted); max-width:76%; margin-bottom:14px;}
  .label-facts{ display:grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; padding-top:12px; border-top:1px dashed var(--line); }
  .fact-label{ font-family:var(--mono); font-size:9.5px; color:var(--text-faint); text-transform:uppercase; }
  .fact-value{ font-family:var(--mono); font-size:12.5px; color:var(--text); margin-top:2px; }
  .label-note{ margin-top:14px; font-size:11.5px; color:var(--text-faint); line-height:1.5; font-style:italic; border-top:1px dashed var(--line); padding-top:10px; }

  .radar-wrap{ margin-top:14px; background: var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px 14px; display:flex; flex-direction:column; align-items:center; }
  .radar-wrap h3{ font-family:var(--serif); font-size:15px; font-weight:600; align-self:flex-start; margin-bottom:10px;}
  .radar-legend{ display:grid; grid-template-columns: 1fr 1fr; gap:6px 12px; width:100%; margin-top:12px; }
  .legend-row{ display:flex; align-items:center; justify-content:space-between; font-size:11px; }
  .legend-row .dim{ color:var(--text-muted); } .legend-row .val{ font-family:var(--mono); color:var(--gold); }

  .rec-card{ margin-top:14px; background: var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 16px 6px; }
  .rec-card h3{ font-family:var(--serif); font-size:15px; font-weight:600; margin-bottom:4px;}
  .rec-reason{ font-size:12px; color:var(--text-muted); line-height:1.5; margin-bottom:12px; }
  .action-item{ display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  .action-rank{ font-family:var(--serif); font-size:17px; color:var(--gold); width:20px; flex-shrink:0; }
  .action-icon{ font-size:18px; flex-shrink:0; }
  .action-body{ flex:1; }
  .action-title{ font-size:13px; font-weight:600; text-transform:capitalize; }
  .action-reason{ font-size:11px; color:var(--text-faint); margin-top:2px; }

  .info-block{ margin-top:14px; background: var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .info-block h3{ font-family:var(--serif); font-size:14.5px; font-weight:600; margin-bottom:8px;}
  .storage-row{ display:flex; gap:10px; margin-bottom:6px; }
  .storage-tag{ font-family:var(--mono); font-size:10px; text-transform:uppercase; color:var(--gold); flex-shrink:0; width:68px; }
  .storage-desc{ font-size:12px; color:var(--text-muted); line-height:1.5; }
  .pairing-pill{ display:inline-block; font-size:11.5px; padding:6px 12px; border-radius:999px; border:1px solid var(--line); color:var(--text-muted); margin:0 5px 6px 0; }

  .status-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .status-btn{
    font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.4px;
    padding:8px 12px; border-radius:999px; border:1px solid var(--line); color:var(--text-muted); cursor:pointer; background:transparent;

  .star-row{ display:flex; gap:8px; margin-top:8px; }
  .star-btn{ background:none; border:none; cursor:pointer; font-size:24px; color: var(--line); opacity:.5; }

  .bottomnav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
    display:flex; background: rgba(17,18,13,0.94); backdrop-filter: blur(12px); border-top:1px solid var(--line);
    padding: 10px 18px calc(10px + env(safe-area-inset-bottom));
  }
  .navbtn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; cursor:pointer; color:var(--text-faint); font-family:var(--mono); font-size:9.5px; text-transform:uppercase;
  }
  .navbtn.active{ color: var(--gold); }
  .navbtn svg{ width:20px; height:20px; }
  .back-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; cursor:pointer; color:var(--text-muted); font-size:13px; }
  .error-box{ background: rgba(140,42,58,0.12); border:1px solid var(--wine); color:#E8B9C0; border-radius:12px; padding:12px 14px; font-size:12px; margin-top:14px; }

<body>
<div id="app">
  <div class="topbar">
    <div>
      <div class="wordmark">BOTTLE<span>.</span></div>
      <div class="tagline">know what to do with it</div>
    </div>
  </div>

  <main id="main"></main>

  <nav class="bottomnav">
    <button class="navbtn" id="nav-home" onclick="goHome()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/></svg>
      Scan
    </button>
    <button class="navbtn" id="nav-cellar" onclick="renderCellar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3v18M15 3v18"/></svg>
      Cellar
    </button>
  </nav>
</div>

<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
<input type="file" id="galleryInput" accept="image/*" style="display:none;">

<script>
/* ---------------- State ---------------- */
let cellar = [];
let currentScan = null;
let currentDetailId = null;
let currentScene = 'cooler'; // 'cooler' (未開), 'wood' (已開), 'bar' (喝完展示)

const DIM_LABELS = { mv:"市場價值", ql:"品質", dv:"飲用價值", pv:"配餐價值", sv:"話題價值", gv:"送禮價值", cv:"收藏價值", sto:"保存價值" };
const ACTION_ICONS = { drink:"🥃", pair:"🍽️", share:"👥", gift:"🎁", collect:"💎", sell:"💰", store:"🌡️", keep:"💎" };
const WORKER_API_URL = "https://bottlesense-api.fiveathree.workers.dev";

/* ---------------- 專業 IndexedDB 儲存庫（支援無限儲存相片） ---------------- */
const DB_NAME = 'BottleSenseDB';
const DB_VERSION = 1;
const STORE_NAME = 'bottles';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function loadCellarFromDB() {
  try {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.getAll();
      req.onsuccess = () => {
        cellar = (req.result || []).sort((a,b)=> (b.addedAt||0) - (a.addedAt||0));
        resolve();
      };
      req.onerror = () => { cellar = []; resolve(); };
    });
  } catch(e) {
    console.error('DB read error', e);
    cellar = [];
  }
}

async function saveBottleToDB(bottle) {
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.put(bottle);
  } catch(e) {
    console.error('DB write error', e);
  }
}

async function deleteBottleFromDB(id) {
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.delete(id);
  } catch(e) {
    console.error('DB delete error', e);
  }
}

/* ---------------- Navigation ---------------- */
function setActiveNav(id){
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));
  const el = document.getElementById(id);
  if(el) el.classList.add('active');
}

function goHome(){ setActiveNav('nav-home'); renderHome(); }

/* ---------------- Home (Scan) ---------------- */
function renderHome(){
  setActiveNav('nav-home');
  const unopenedCount = cellar.filter(b=>b.status==='unopened').length;
  const openedCount = cellar.filter(b=>b.status==='opened').length;

function categoryEmoji(cat){

  if(c.includes('sake')||c.includes('泡盛')) return '🍶';
  return '🍷';
}

/* ---------------- 拍照與相片壓縮 ---------------- */
async function handleFileSelect(e) {
  const file = e.target.files[0];
  if(!file) return;
  e.target.value = '';
  try {
    // 壓縮至 1280px，既清晰又適合 AI 分析與 IndexedDB 永久保存
    const dataUrl = await compressImage(file, 1280, 0.85);
    await runScan(dataUrl);
  } catch (err) {
    console.error('Image compression error', err);
    const dataUrl = await fileToDataUrl(file);
    await runScan(dataUrl);
  }
}

document.getElementById('cameraInput').addEventListener('change', handleFileSelect);
document.getElementById('galleryInput').addEventListener('change', handleFileSelect);

function fileToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = ()=> reject(new Error('read failed'));
    r.readAsDataURL(file);
  });
}

function compressImage(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event)=>{
      const img = new Image();
      img.src = event.target.result;
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        if(width > maxWidth){
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = (err)=> reject(err);
    };
    reader.onerror = (err)=> reject(err);
  });
}

/* ---------------- 呼叫 Worker 進行分析 ---------------- */
async function runScan(dataUrl){
  renderLoading(dataUrl);
  const messages = ["正在辨識酒標...", "正在比對產區與風味...", "正在計算價值地圖...", "正在生成專業建議..."];
  let mi = 0;
  const loadingInterval = setInterval(()=>{
    mi = (mi+1) % messages.length;
    const el = document.getElementById('loading-text');
    if(el) el.textContent = messages[mi];
  }, 1400);

  try{
    const [header, base64Data] = dataUrl.split(',');
    const mediaTypeMatch = header.match(/data:(.*);base64/);
    const mediaType = mediaTypeMatch ? mediaTypeMatch[1] : 'image/jpeg';

    const response = await fetch(WORKER_API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: base64Data, mediaType: mediaType })
    });

    if(!response.ok){
      throw new Error('API request failed: ' + response.status);
    }

    const parsed = await response.json();
    clearInterval(loadingInterval);
    currentScan = { raw: parsed, image: dataUrl, scannedAt: Date.now() };
    renderResult(currentScan);

  }catch(err){
    clearInterval(loadingInterval);
    console.error('Scan error:', err);
    renderScanError(dataUrl);
  }
}

  setActiveNav('');
  document.getElementById('main').innerHTML = `

function renderRadar(vm){
  const order = ['mv','ql','dv','pv','sv','gv','cv','sto'];
  const cx = 130, cy = 130, R = 95;
  const n = order.length;
  const points = order.map((k,i)=>{
    const angle = (Math.PI*2*i/n) - Math.PI/2;
    const val = Math.max(0, Math.min(100, vm[k] || 0));
    const r = (val/100) * R;
    return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
  });
  const axisPoints = order.map((k,i)=>{
    const angle = (Math.PI*2*i/n) - Math.PI/2;
    return [cx + R*Math.cos(angle), cy + R*Math.sin(angle)];
  });

  const polygon = points.map(p=>p.join(',')).join(' ');
  const rings = [0.25,0.5,0.75,1].map(f=>{
    const ringPts = order.map((k,i)=>{
      const angle = (Math.PI*2*i/n) - Math.PI/2;
      return [cx + R*f*Math.cos(angle), cy + R*f*Math.sin(angle)].join(',');
    }).join(' ');
    return `<polygon points="${ringPts}" fill="none" stroke="#2E3224" stroke-width="1"/>`;
  }).join('');
  const axes = axisPoints.map(p=>`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#2E3224" stroke-width="1"/>`).join('');

  const legend = order.map(k=>`
    <div class="legend-row"><span class="dim">${DIM_LABELS[k]}</span><span class="val">${vm[k] ?? '—'}</span></div>
  `).join('');

  return `
    <div class="radar-wrap">
      <h3>Bottle Value Map</h3>
      <svg width="260" height="260" viewBox="0 0 260 260">
        ${rings}
        ${axes}
        <polygon points="${polygon}" fill="rgba(212,175,55,0.25)" stroke="#D4AF37" stroke-width="2"/>
        ${points.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#D4AF37"/>`).join('')}
      </svg>
      <div class="radar-legend">${legend}</div>
    </div>
  `;
}

  if(status === 'unopened') currentScene = 'cooler';
  else if(status === 'opened') currentScene = 'wood';
  else currentScene = 'bar';
  renderDetail(id);
}

  if(!b) return;
  b.personalRating = n;
  await saveBottleToDB(b);
  renderDetail(id);
}

async function removeBottle(id){
  cellar = cellar.filter(x=>x.id!==id);
  await deleteBottleFromDB(id);
  renderCellar();
}

/* ---------------- utils ---------------- */
function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---------------- init ---------------- */
(async function init(){
  await loadCellarFromDB();
  goHome();
})();
</script>
